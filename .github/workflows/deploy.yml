name: 部署

# push 到 main 就部署到 Cloudflare Workers，不用再记得手动跑 wrangler deploy。
#
# 为什么走 GitHub Actions 而不是 Cloudflare Pages 的 Git 集成：站点现在部署在
# Workers 上，dist 里的产物（材料页、可下载 Excel、robots/sitemap）随仓库提交，
# 部署这一步就是「把 dist 传上去」。换成 Pages 意味着要改成构建时生成产物、
# 把它们从仓库里挪出去，还要在 Pages 的构建镜像里凑齐 Node 与 Python 两套
# 环境——为了省一次手动命令，不值得动这些。
#
# 未配置凭据时整条跳过。刚 fork 出去、或者还没拿到 API Token 的时候，
# 不该因为缺一把钥匙就把 CI 染红——部署没跑是明摆着的事实，不需要用红灯表达。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 部署到 Cloudflare Workers
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # dist 里的产物都随仓库提交，部署时不需要再构建，直接上传。
      # 有改动没重新生成的话，audit.yml 里的 check:prerender / check:xlsx 会先拦下来。
      - name: 部署
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
